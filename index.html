/* ===== API ===== */
async function api(path,{method='GET',body,auth,raw}={},retry=true){
  let u=CFG.API+path;
  if(method==='GET')u+=(u.includes('?')?'&':'?')+'lang='+(['uz','ru','en'].includes(lang)?lang:'en');
  const h={};if(!raw)h['Content-Type']='application/json';
  if(tk())h.Authorization='Bearer '+tk();
  let r;for(let i=0;;i++){try{r=await fetch(u,{method,headers:h,body:raw?body:body&&JSON.stringify(body)});break}catch(e){if(i>=2||method!=='GET')throw new Error(t('net'));await new Promise(z=>setTimeout(z,4000))}}
  if(r.status===401&&retry&&localStorage.getItem('rt')){
    const f=await fetch(CFG.API+'/auth/refresh',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({refresh_token:localStorage.getItem('rt')})});
    if(f.ok){const d=await f.json();setTok(d);return api(path,{method,body,auth,raw},false)} setTok(null);
  }
  const d=await r.json().catch(()=>({}));
  if(!r.ok){const e=new Error(typeof d.detail==='string'?d.detail:t('err'));e.status=r.status;throw e}
  return d;
}
function setTok(d){if(d){localStorage.setItem('at',d.access_token);localStorage.setItem('rt',d.refresh_token)}else{localStorage.removeItem('at');localStorage.removeItem('rt')}chrome()}

/* ===== Chrome ===== */
function chrome(){
  const h=location.hash||'#/';
  $('#nav').innerHTML=[['#/','home'],['#/tours','tours'],['#/services','services'],['#/about','about'],['#/contact','contact']]
    .map(([a,k])=>`<a href="${a}" class="${h===a||(a!=='#/'&&h.startsWith(a))?'on':''}">${t(k)}</a>`).join('');
  $('#lng').value=lang;document.documentElement.lang=lang;
  $('#auth').textContent=tk()?t('logout'):t('login');
  $('#wa').href='https://wa.me/'+CFG.WA;
  $('#foot').innerHTML=`<p><b>Discover Stans</b> — ${esc(t('trust'))}: ${esc(CFG.COMPANY)}, № ${CFG.LICENSE}</p>
  <p><a href="mailto:${CFG.EMAIL}">${CFG.EMAIL}</a> · <a href="https://wa.me/${CFG.WA}">WhatsApp</a> · <a href="https://t.me/${CFG.TG}">Telegram</a></p>
  <p>${['#/tours','#/services','#/about','#/contact'].map((a,i)=>`<a href="${a}">${t(['tours','services','about','contact'][i])}</a>`).join(' · ')}</p>`;
}

function authDlg(then,mode='login'){
  const d=$('#dlg');
  d.innerHTML=`<form id="af"><h3>${t(mode==='login'?'login':'reg')}</h3>
  ${mode==='reg'?`<input name="full_name" placeholder="${t('name')}" required><input name="phone" placeholder="${t('phone')}">`:''}
  <input name="email" type="email" placeholder="${t('email')}" required autocomplete="email">
  <input name="password" type="password" placeholder="${t('pw')}" required minlength="6" autocomplete="${mode==='login'?'current-password':'new-password'}">
  <div id="ae"></div><button class="btn">${t(mode==='login'?'login':'reg')}</button>
  <button type="button" class="btn o" id="sw">${t(mode==='login'?'nev':'have')}</button></form>`;
  d.showModal();
  $('#sw').onclick=()=>authDlg(then,mode==='login'?'reg':'login');
  $('#af').onsubmit=async e=>{e.preventDefault();const f=Object.fromEntries(new FormData(e.target));
    try{
      if(mode==='reg'){await api('/auth/register',{method:'POST',body:{...f,preferred_language:lang}})}
      setTok(await api('/auth/login',{method:'POST',body:{email:f.email,password:f.password}}));
      d.close();then&&then();
    }catch(x){$('#ae').innerHTML=`<div class="msg err">${esc(x.message)}</div>`}};
}

const card=x=>{const im=img(x.images||x.image||x.cover_image);return `<article class="card"><a class="imw ${im?'':'ph'}" href="#/tour/${esc(x.slug)}">${im?`<img class="im" onload="this.classList.add('l')" onerror="this.parentNode.classList.add('ph');this.outerHTML=artFor(this.alt)" loading="lazy" alt="${esc(x.title)}" src="${esc(im)}">`:artFor(x.title)}${price(x)!=null?`<span class="chip">${t('from')} ${money(price(x))}</span>`:''}</a>
<div class="bd"><h3><a href="#/tour/${esc(x.slug)}">${esc(x.title)}</a></h3><div class="mut">${esc(x.duration||x.short_description||'')}</div></div></article>`};

const views={

  app.innerHTML=`<section class="hero pat"><div class="w hg"><div><h1>${esc(t('h1'))}</h1><p>${esc(t('sub'))}</p>
  <form class="hs" id="hs"><input placeholder="${t('search')}" aria-label="${t('search')}"><button class="btn g">${t('tours')}</button></form></div>

  <div class="w"><div class="sbar"><div class="stats" id="st"></div></div></div>

  <section class="w" style="padding-bottom:64px"><h2>${t('how')}</h2><div class="steps">${t('steps').map(([a,b])=>`<div><h3>${a}</h3><p class="mut">${b}</p></div>`).join('')}</div></section>
  <section class="w"><div class="cta pat"><div><h2>${t('cta')[0]}</h2><p>${t('cta')[1]}</p></div><a class="btn g" href="https://wa.me/${CFG.WA}" target="_blank" rel="noopener">WhatsApp</a></div></section>
  <section class="sec w"><div class="box"><h3>${t('trust')}</h3><p class="mut" style="margin:0">${esc(t('trustT').replace('{l}',CFG.LICENSE).replace('{c}',CFG.COMPANY))}</p></div></section>`;
  $('.hero h1').innerHTML=t('h1').split(' ').map((w,i)=>`<span class="wd" style="animation-delay:${.1+i*.07}s">${esc(w)}</span>`).join(' ');
  $('#hs').onsubmit=e=>{e.preventDefault();location.hash='#/tours?search='+encodeURIComponent($('#hs input').value)};
  $('.hero').onpointermove=e=>{const h=e.currentTarget,r=h.getBoundingClientRect();h.style.setProperty('--mx',(e.clientX-r.left)+'px');h.style.setProperty('--my',(e.clientY-r.top)+'px')};
  api('/site-stats').then(s=>{$('#st').innerHTML=[['years_experience','y'],['satisfaction_percent','s'],['completed_trips','c'],['happy_travelers','h']]
    .filter(([k])=>s[k]).map(([k,l])=>`<div><b data-n="${+s[k]}" data-x="${k==='satisfaction_percent'?'%':'+'}">${(+s[k]).toLocaleString()}${k==='satisfaction_percent'?'%':'+'}</b><span>${t(l).replace('% ','')}</span></div>`).join('')}).catch(()=>{});
  try{const d=await api('/tours?page_size=6&featured=true');$('#ft').innerHTML=(d.items||[]).map(card).join('')||t('none');const f=(d.items||[])[0],u=f&&img(f.images||f.image||f.cover_image);if(u)$('#arch').innerHTML='',$('#arch').style.backgroundImage='url("'+u.replace(/"/g,'%22')+'")'}catch(e){$('#ft').textContent=e.message}
},
async tours(){
  const q=new URLSearchParams((location.hash.split('?')[1])||'');
  app.innerHTML=`<section class="sec w"><h1 class="pt">${t('tours')}</h1>
  <form class="filters" id="fl"><input name="search" placeholder="${t('search')}" value="${esc(q.get('search')||'')}">
  <select name="country"><option value="">${t('country')}</option></select>
  <input name="min_price" type="number" min="0" placeholder="${t('min')}" value="${esc(q.get('min_price')||'')}">
  <input name="max_price" type="number" min="0" placeholder="${t('max')}" value="${esc(q.get('max_price')||'')}"></form>
  <div class="grid" id="tl">${t('loading')}</div><div class="pg" id="pg"></div></section>`;
  const sel=$('[name=country]');
  api('/countries').then(c=>{(c.items||c).forEach(x=>sel.insertAdjacentHTML('beforeend',`<option value="${esc(x.slug)}" ${q.get('country')===x.slug?'selected':''}>${esc(x.name)}${x.tour_count!=null?` (${x.tour_count})`:''}</option>`))}).catch(()=>{});
  $('#fl').onchange=$('#fl').onsubmit=e=>{e.preventDefault();const p=new URLSearchParams(new FormData($('#fl')));[...p].forEach(([k,v])=>!v&&p.delete(k));location.hash='#/tours?'+p};
  const p=new URLSearchParams(q);p.set('page_size',12);
  try{const d=await api('/tours?'+p);$('#tl').innerHTML=(d.items||[]).map(card).join('')||`<p>${t('none')}</p>`;
    const pg=+d.page||1,n=+d.pages||1;
    if(n>1)$('#pg').innerHTML=Array.from({length:n},(_,i)=>{const z=new URLSearchParams(q);z.set('page',i+1);return `<a class="btn ${i+1===pg?'':'o'}" href="#/tours?${z}">${i+1}</a>`}).join('')
  }catch(e){$('#tl').textContent=e.message}
},
async tour(slug){
  app.innerHTML=`<div class="w sec">${t('loading')}</div>`;
  let x;try{x=await api('/tours/'+encodeURIComponent(slug))}catch(e){app.innerHTML=`<div class="w sec"><p>${esc(e.message)}</p></div>`;return}
  document.title=x.title+' — Discover Stans';
  const ims=(x.images||[]).map(img).filter(Boolean),it=x.itinerary||x.days||[],rv=x.reviews||[];
  app.innerHTML=`<section class="sec w"><div class="two"><div>
  <h1 class="pt">${esc(x.title)}</h1><p class="mut">${esc(x.duration||'')}</p>
  ${ims.length?`<div class="grid" style="grid-template-columns:repeat(auto-fill,minmax(200px,1fr));margin:16px 0">${ims.slice(0,6).map(s=>`<img loading="lazy" alt="" src="${esc(s)}" style="border-radius:12px;aspect-ratio:4/3;object-fit:cover;width:100%">`).join('')}</div>`:`<div class="artb">${artFor(x.title)}</div>`}
  <p style="white-space:pre-line">${esc(x.description||'')}</p>
  ${it.length?`<h2>${t('itin')}</h2>${it.map((d,i)=>`<div class="day"><b>${esc(d.title||d.name||'')}</b><div class="mut" style="white-space:pre-line">${esc(d.description||'')}</div></div>`).join('')}`:''}
  <h2>${t('reviews')}</h2>${rv.length?rv.map(r=>`<div class="box" style="margin-bottom:10px"><b>${'★'.repeat(r.rating||0)}</b> <span class="mut">${esc(r.reviewer_country||'')}</span><p>${esc(r.text)}</p></div>`).join(''):`<p class="mut">${t('noRev')}</p>`}
  </div><aside><div class="box" style="position:sticky;top:76px"><h3>${price(x)!=null?t('from')+' '+money(price(x)):''}</h3>
  <form id="bk"><label>${t('name')}<input name="full_name" required></label><label>${t('email')}<input name="email" type="email" required></label>
  <label>${t('phone')}<input name="phone" required></label><label>${t('date')}<input name="tour_date" type="date" required min="${new Date().toISOString().slice(0,10)}"></label>
  <div class="row"><label>${t('adults')}<input name="num_adults" type="number" min="1" value="2"></label><label>${t('kids')}<input name="num_children" type="number" min="0" value="0"></label></div>
  <label>${t('notes')}<textarea name="notes" rows="2"></textarea></label><div id="bm"></div><button class="btn">${t('book')}</button>
  <a class="btn o" target="_blank" rel="noopener" style="text-align:center" href="https://wa.me/${CFG.WA}?text=${encodeURIComponent(x.title)}">Book on WhatsApp</a></form></div></aside></div></section>`;
  $('#bk').onsubmit=async e=>{e.preventDefault();const f=Object.fromEntries(new FormData(e.target));
    f.num_adults=+f.num_adults;f.num_children=+f.num_children;f.tour_id=x.id;
    try{const b=await api('/bookings',{method:'POST',body:f});
      $('#bm').innerHTML=`<div class="msg"><b>${t('paid')}</b><br>${t('ref')}: ${esc(b.booking_number)}<br><br>${t('pay')}:<br>
      <button type="button" class="btn" data-p="payme" style="margin:6px 4px 0 0">🇺🇿 ${t('local')}</button>
      <button type="button" class="btn o" data-p="stripe" style="margin-top:6px">💳 ${t('intl')}</button></div>`;
      $('#bm').onclick=ev=>{const p=ev.target.dataset.p;p&&pay(b.id,p)};
    }catch(er){$('#bm').innerHTML=`<div class="msg err">${esc(er.message)}</div>`}};
},

},

  app.innerHTML=`<section class="sec w" style="max-width:760px"><h1 class="pt">${t('about')}</h1><p>${esc(t('aboutT'))}</p><div class="dts" style="margin:28px 0;max-width:620px">${['samarkand','bukhara','khiva'].map(k=>`<div class="dt">${art(k)}</div>`).join('')}</div>

  <p class="mut"><a href="mailto:${CFG.EMAIL}">${CFG.EMAIL}</a> · <a href="https://t.me/${CFG.TG}">Telegram</a></p></section>`;
  $('#cf').onsubmit=e=>{e.preventDefault();const f=Object.fromEntries(new FormData(e.target));
    const m=`Name: ${f.name}\nPhone: ${f.phone}\nEmail: ${f.email}\nTour: ${f.tour}\nDate: ${f.date}\nPeople: ${f.people}\n${f.msg}`;
    window.open('https://wa.me/'+CFG.WA+'?text='+encodeURIComponent(m),'_blank','noopener')};
}
};

async function pay(id,provider){
  if(!tk())return authDlg(()=>pay(id,provider));
  try{const r=await api('/payments/init',{method:'POST',body:{booking_id:id,provider}});
    $('#bm').innerHTML=`<div class="msg">${t('redir')}</div>`;location.href=r.payment_url}
  catch(e){if(e.status===401)authDlg(()=>pay(id,provider));else $('#bm').insertAdjacentHTML('beforeend',`<div class="msg err">${esc(e.message)}</div>`)}
}

function route(){
  const [p,...r]=(location.hash||'#/').slice(2).split('?')[0].split('/');
  document.title='Discover Stans — Tours in Uzbekistan';
  chrome();scrollTo(0,0);app.classList.remove('in');void app.offsetWidth;app.classList.add('in');
  (views[p||'home']||views.home)(decodeURIComponent(r[0]||''));
}
/* ===== Animatsiya mantig'i ===== */
const RM=matchMedia('(prefers-reduced-motion:reduce)').matches;
const rio=new IntersectionObserver(es=>es.forEach(e=>{if(!e.isIntersecting)return;const el=e.target;rio.unobserve(el);el.classList.add('on');
  setTimeout(()=>{el.classList.remove('rv','on');el.style.transitionDelay=''},1100)}),{threshold:.1});
const cio=new IntersectionObserver(es=>es.forEach(e=>{if(!e.isIntersecting)return;cio.unobserve(e.target);
  const b=e.target,n=+b.dataset.n,x=b.dataset.x,t0=performance.now();
  (function f(now){const k=Math.min(1,(now-t0)/1500);b.textContent=Math.round(n*(1-Math.pow(1-k,3))).toLocaleString()+x;if(k<1)requestAnimationFrame(f)})(t0)}));
function rv(){
  if(RM)return;
  app.querySelectorAll('.card,.steps>div,.cta,.sbar,.box,.day,.hd,.dt').forEach(el=>{
    if(el.dataset.r)return;el.dataset.r=1;
    el.style.transitionDelay=Math.min([...el.parentNode.children].indexOf(el),6)*80+'ms';
    el.classList.add('rv');rio.observe(el)});
  app.querySelectorAll('b[data-n]').forEach(b=>{if(b.dataset.o)return;b.dataset.o=1;b.textContent='0'+b.dataset.x;cio.observe(b)});
}
new MutationObserver(rv).observe(app,{childList:true,subtree:true});
addEventListener('scroll',()=>{const h=document.documentElement,m=h.scrollHeight-innerHeight;
  $('#sp').style.transform='scaleX('+(m>0?scrollY/m:0)+')';$('header').classList.toggle('sc',scrollY>8)},{passive:true});
const thEl=$('#th'),de=document.documentElement;
const thIcon=()=>thEl.textContent=de.dataset.theme==='dark'?'☀':'☾';thIcon();
thEl.onclick=()=>{const n=de.dataset.theme==='dark'?'light':'dark';de.classList.add('tt');de.dataset.theme=n;try{localStorage.setItem('th',n)}catch(e){}thIcon();setTimeout(()=>de.classList.remove('tt'),600)};
addEventListener('hashchange',route);route();
</script>
